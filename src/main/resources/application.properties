########################################
# Application Information
########################################

spring.application.name=Gmail Management System

server.port=8080

########################################
# H2 DATABASE
########################################

spring.datasource.url=jdbc:h2:mem:gmail

spring.datasource.driverClassName=org.h2.Driver

spring.datasource.username=sa



########################################
# JPA
########################################

spring.jpa.show-sql=true

spring.jpa.hibernate.ddl-auto=update

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.jpa.properties.hibernate.format_sql=true

########################################
# H2 Console
########################################

spring.h2.console.enabled=true

spring.h2.console.path=/h2-console

########################################
# JWT
########################################



########################################
# Default Admin Seed
# Created automatically on first startup if no ADMIN user exists yet.
# Change this password after first login, and consider moving it to an
# environment variable for anything beyond local development.
########################################

########################################
# Gmail API
########################################

gmail.application.name=AI Gmail Management System

gmail.credentials.path=credentials/credentials.json

gmail.tokens.directory=tokens

# ==========================================
# Gemini AI Configuration
# ==========================================

gemini.api.key=${GEMINI_API_KEY}
########################################
# Mail (SMTP) - used for forgot-password / email-verification OTPs.
# Fill these in with a real account (e.g. a Gmail address + App Password)
# to actually deliver mail. Until then, OTP codes are logged to the
# console instead (see MailServiceImpl), so the flows still work locally.
########################################

spring.mail.host=smtp.gmail.com

spring.mail.port=587

spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}

spring.mail.password=${MAIL_PASSWORD:your-app-password}

spring.mail.properties.mail.smtp.auth=true

spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from=${MAIL_USERNAME:your-email@gmail.com}

app.otp.expiry-minutes=10

########################################
# File uploads (avatars)
########################################

app.upload.dir=uploads

########################################
# Logging
########################################

logging.level.root=INFO

logging.level.org.springframework.security=DEBUG

logging.level.org.hibernate.SQL=DEBUG

########################################
# Multipart Upload
########################################

spring.servlet.multipart.max-file-size=20MB

spring.servlet.multipart.max-request-size=20MB