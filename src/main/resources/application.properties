# ==========================================
# Application Information
# ==========================================

spring.application.name=Gmail Management System

server.port=${PORT:8080}


# ==========================================
# H2 DATABASE
# ==========================================

spring.datasource.url=jdbc:h2:mem:gmail
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=


# ==========================================
# JPA
# ==========================================

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true


# ==========================================
# H2 Console
# ==========================================

spring.h2.console.enabled=false
spring.h2.console.path=/h2-console


# ==========================================
# JWT
# ==========================================

jwt.secret=${JWT_SECRET}


# ==========================================
# Gmail API
# ==========================================

gmail.application.name=AI Gmail Management System
gmail.credentials.path=credentials/credentials.json
gmail.tokens.directory=tokens


# ==========================================
# Gemini AI
# ==========================================

gemini.api.key=${GEMINI_API_KEY}


# ==========================================
# Mail / SMTP
# ==========================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from=${MAIL_USERNAME}
app.otp.expiry-minutes=10


# ==========================================
# File uploads
# ==========================================

app.upload.dir=uploads


# ==========================================
# Logging
# ==========================================

logging.level.root=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO


# ==========================================
# Multipart Upload
# ==========================================

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
